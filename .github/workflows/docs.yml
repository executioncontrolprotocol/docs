# Lint / validate Mintlify docs on every change to main and feat/** (and on PRs).
# Same as `npm run lint` locally / Husky (`mintlify validate` + `mintlify broken-links`).
#
# The Mintlify GitHub App may still deploy on push to main unless you enable **Blocking**
# CI checks in the Mintlify dashboard (Add-ons). See `.github/README.md`.
# Do not merge CLI-reset work to main until the rewrite is ready to deploy.
#
# Workflow runs on all pushes/PRs to `main` and `feat/**` (no path filters) so a single
# required status check name is always present for branch protection.

name: Docs

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secretlint (working tree)
        run: npm run secrets:scan
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Gitleaks (git history)
        run: gitleaks detect --source . --redact --verbose --config .gitleaks.toml

  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    needs: secrets

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Mintlify docs (same as pre-commit)
        run: npm run lint

  generated-reference:
    name: Generated reference
    runs-on: ubuntu-latest
    needs: secrets
    timeout-minutes: 15
    steps:
      - name: Checkout docs
        uses: actions/checkout@v5

      - name: Checkout ECP (milestone/cli-reset)
        uses: actions/checkout@v5
        with:
          repository: executioncontrolprotocol/executioncontrolprotocol
          ref: milestone/cli-reset
          path: ecp

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate CLI, plugin catalogue, and llms.txt
        run: npm run generate:reference -- --ecp-root ecp

      - name: Fail if generated files are stale
        run: git diff --exit-code -- reference/cli.mdx reference/plugins.mdx llms.txt
